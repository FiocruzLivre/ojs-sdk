name: Release Drafter

# On every merge to main, updates the draft of the next release
# with the list of merged PRs
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create and edit the release draft
      pull-requests: read  # read PRs and their labels

    steps:
      - uses: release-drafter/release-drafter@d749bd2b1d1e1db5c7a422e645f7e4ec23f604e3 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
