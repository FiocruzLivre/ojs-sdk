name: ci

on:
  pull_request:
  push:
    branches: [ main ]

env:
  OJS_WEB_BASEDIR: /home/runner/work/ojs-sdk/ojs-sdk/ojs/
  OJS_LOGIN_URL: http://localhost/ojs/index.php/journal/login/signIn
  TEST_DB_HOST: 127.0.0.1
  TEST_DB_PORT: 3306

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      # do not stop on another job's failure
      fail-fast: false
      matrix:
        php-versions: ['8.2']
        databases: ['mysql']
        server-versions: ['3_4_0-10']
    name: php${{ matrix.php-versions }}-${{ matrix.databases }}-${{ matrix.server-versions }}
    services:
      mysql:
        image: mariadb:10.11
        ports:
          - 3306:3306/tcp
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ojs
        options: --health-cmd="mysqladmin ping" --health-interval 5s --health-timeout 5s --health-retries 10 --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Checkout OJS
        uses: actions/checkout@master
        with:
          repository: pkp/ojs
          ref: ${{ matrix.server-versions }}
          path: ojs
          submodules: true

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: gettext, intl, mysql, pdo_mysql

      - name: Install Composer dependencies
        run: |
          composer install
          composer --working-dir=ojs/lib/pkp install
          composer --working-dir=ojs/plugins/paymethod/paypal install
          composer --working-dir=ojs/plugins/generic/citationStyleLanguage install

      - name: Install OJS
        run: php tests/setupOjs.php

      - name: PHPUnit
        run: composer unit

  php-cs-fixer:
    runs-on: ubuntu-latest
    strategy:
      # do not stop on another job's failure
      fail-fast: false
      matrix:
        php-versions: ['8.2']
        server-versions: ['3_4_0-10']

    name: php-cs check php${{ matrix.php-versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up php
        uses: shivammathur/setup-php@master
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Install Composer dependencies
        run: composer install

      - name: Run coding standards check
        run: composer cs:check